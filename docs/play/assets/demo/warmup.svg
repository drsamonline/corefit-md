<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Warm-up: stand tall, roll the shoulders, then cat-cow and glute bridges">
<title>Warm-up: stand tall, roll the shoulders, then cat-cow and glute bridges</title>
<style>
  .f{fill:none;stroke:#e7f3ed;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .l{fill:none;stroke:#e7f3ed;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .ghost{fill:none;stroke:#7fa79a;stroke-width:3;stroke-linecap:round;stroke-dasharray:3 7;opacity:.55}
  .head{fill:#e7f3ed;stroke:none}
  .mat{stroke:#2b4c43;stroke-width:3;stroke-linecap:round}
  .joint{fill:#0d2b24;stroke:#ff7a45;stroke-width:2.2}
  .glow{fill:none;stroke:#ff7a45;stroke-width:3;stroke-linecap:round;opacity:.85}
  g[data-o]{transform-box:view-box}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

  .arms{animation:arms 4s ease-in-out infinite}
  @keyframes arms{0%,100%{transform:rotate(0)}50%{transform:rotate(78deg)}}
</style>
<line class="mat" x1="28" y1="142" x2="292" y2="142"/>

  <line class="f" x1="150" y1="112" x2="150" y2="76"/>
  <circle class="head" cx="150" cy="58" r="10"/>
  <line class="l" x1="150" y1="112" x2="138" y2="140"/>
  <line class="l" x1="150" y1="112" x2="162" y2="140"/>
  <g data-o="1" style="transform-origin:150px 78px" class="arms">
    <line class="l" x1="150" y1="78" x2="122" y2="62"/>
    <line class="l" x1="150" y1="78" x2="178" y2="62"/>
    <circle class="joint" cx="150" cy="78" r="3.2"/>
  </g>

</svg>
