<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Warm-up: stand tall, roll the shoulders back, then cat-cow and glute bridges">
<title>Warm-up: stand tall, roll the shoulders back, then cat-cow and glute bridges</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#ff7a45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
  </defs>

<style>
  .near{fill:none;stroke:#eaf5ef;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
  .far{fill:none;stroke:#6f9488;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .move{fill:none;stroke:#ff7a45;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
  .torso{fill:#eaf5ef;stroke:none}
  .torsofar{fill:#6f9488;stroke:none;opacity:.9}
  .head{fill:#eaf5ef;stroke:none}
  .headfar{fill:#6f9488;stroke:none;opacity:.9}
  .mat{stroke:#2f5e52;stroke-width:2.5;stroke-linecap:round}
  .shadow{fill:#000000;opacity:.32}
  .ref{fill:none;stroke:#6f9488;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:4 7;opacity:.75}
  .arc{fill:none;stroke:#ff7a45;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:5 6;opacity:.8}
  .glow{fill:none;stroke:#ff7a45;stroke-width:3;stroke-linecap:round;opacity:.8}
  g[data-o]{transform-box:view-box}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

  .arms{animation:arms 4s ease-in-out infinite}
  @keyframes arms{0%,100%{transform:rotate(0)}50%{transform:rotate(74deg)}}
</style>
<ellipse cx="152" cy="96" rx="96" ry="62" fill="url(#pool)"/>
<line class="mat" x1="26" y1="142" x2="294" y2="142"/>
<g transform="translate(160 142) scale(1.1) translate(-160 -142)">

  <ellipse class="shadow" cx="152" cy="143" rx="34" ry="3.5"/>
  <path class="torso" d="M145 78 L159 78 L161 112 L143 112 Z"/>
  <line class="far" x1="147" y1="112" x2="142" y2="128"/>
  <line class="far" x1="142" y1="128" x2="140" y2="141"/>
  <line class="near" x1="156" y1="112" x2="162" y2="128"/>
  <line class="near" x1="162" y1="128" x2="164" y2="141"/>
  <g data-o="1" style="transform-origin:152px 80px" class="arms">
    <line class="far" x1="150" y1="80" x2="124" y2="66"/>
    <line class="move" x1="155" y1="80" x2="182" y2="66"/>
  </g>
  <line class="near" x1="152" y1="78" x2="152" y2="68" stroke-width="5"/>
  <circle class="head" cx="152" cy="58" r="8.5"/>
  <path class="arc" d="M188 74 q10 12 2 22" marker-end="url(#a)">
    <animate attributeName="opacity" values="0;.85;0" dur="4s" repeatCount="indefinite"/>
  </path>

</g>
</svg>
