<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Dead bug: the opposite arm and leg lower slowly while the low back stays flat">
<title>Dead bug: the opposite arm and leg lower slowly while the low back stays flat</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#ff7a45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
  </defs>

<style>
  .near{fill:none;stroke:#eaf5ef;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
  .far{fill:none;stroke:#6f9488;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .move{fill:none;stroke:#ff7a45;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
  .torso{fill:#eaf5ef;stroke:none}
  .torsofar{fill:#6f9488;stroke:none;opacity:.9}
  .head{fill:#eaf5ef;stroke:none}
  .headfar{fill:#6f9488;stroke:none;opacity:.9}
  .mat{stroke:#2f5e52;stroke-width:2.5;stroke-linecap:round}
  .shadow{fill:#000000;opacity:.32}
  .ref{fill:none;stroke:#6f9488;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:4 7;opacity:.75}
  .arc{fill:none;stroke:#ff7a45;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:5 6;opacity:.8}
  .glow{fill:none;stroke:#ff7a45;stroke-width:3;stroke-linecap:round;opacity:.8}
  g[data-o]{transform-box:view-box}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

  .armUp{animation:arm 4.4s ease-in-out infinite}
  .legOut{animation:leg 4.4s ease-in-out infinite}
  @keyframes arm{0%,22%{transform:rotate(0)}46%,66%{transform:rotate(-56deg)}88%,100%{transform:rotate(0)}}
  @keyframes leg{0%,22%{transform:rotate(0)}46%,66%{transform:rotate(44deg)}88%,100%{transform:rotate(0)}}
</style>
<ellipse cx="140" cy="110" rx="120" ry="52" fill="url(#pool)"/>
<line class="mat" x1="26" y1="130" x2="294" y2="130"/>
<g transform="translate(160 130) scale(1.1) translate(-160 -130)">

  <ellipse class="shadow" cx="130" cy="132" rx="80" ry="3.5"/>
  <path class="torso" d="M78 118 L152 120 L152 128 L78 126 Z"/>
  <line class="far" x1="82" y1="119" x2="88" y2="88"/>
  <line class="far" x1="148" y1="126" x2="172" y2="100"/>
  <line class="far" x1="172" y1="100" x2="198" y2="100"/>
  <line class="near" x1="78" y1="124" x2="120" y2="128"/>
  <g data-o="1" style="transform-origin:86px 119px" class="armUp">
    <line class="move" x1="86" y1="119" x2="94" y2="84"/>
  </g>
  <g data-o="1" style="transform-origin:152px 123px" class="legOut">
    <line class="move" x1="152" y1="123" x2="178" y2="94"/>
    <line class="move" x1="178" y1="94" x2="206" y2="94"/>
  </g>
  <line class="near" x1="78" y1="121" x2="68" y2="117" stroke-width="5"/>
  <circle class="head" cx="58" cy="115" r="8.5"/>
  <path class="arc" d="M104 82 q14 -8 26 -2" marker-end="url(#a)">
    <animate attributeName="opacity" values="0;.9;0" dur="4.4s" repeatCount="indefinite"/>
  </path>

</g>
</svg>
