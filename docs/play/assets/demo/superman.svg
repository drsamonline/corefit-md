<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Superman: lie face down, lift the opposite arm and leg, keep the neck long">
<title>Superman: lie face down, lift the opposite arm and leg, keep the neck long</title>
<style>
  .f{fill:none;stroke:#e7f3ed;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .l{fill:none;stroke:#e7f3ed;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .ghost{fill:none;stroke:#7fa79a;stroke-width:3;stroke-linecap:round;stroke-dasharray:3 7;opacity:.55}
  .head{fill:#e7f3ed;stroke:none}
  .mat{stroke:#2b4c43;stroke-width:3;stroke-linecap:round}
  .joint{fill:#0d2b24;stroke:#ff7a45;stroke-width:2.2}
  .glow{fill:none;stroke:#ff7a45;stroke-width:3;stroke-linecap:round;opacity:.85}
  g[data-o]{transform-box:view-box}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

  .armS{animation:armS 3.8s ease-in-out infinite}
  .legS{animation:legS 3.8s ease-in-out infinite}
  @keyframes armS{0%,100%{transform:rotate(0)}50%{transform:rotate(11deg)}}
  @keyframes legS{0%,100%{transform:rotate(0)}50%{transform:rotate(-11deg)}}
</style>
<line class="mat" x1="28" y1="134" x2="292" y2="134"/>

  <line class="f" x1="96" y1="120" x2="186" y2="120"/>
  <circle class="head" cx="78" cy="116" r="9.5"/>
  <g data-o="1" style="transform-origin:100px 120px" class="armS">
    <line class="l" x1="100" y1="120" x2="64" y2="124"/>
  </g>
  <g data-o="1" style="transform-origin:182px 120px" class="legS">
    <line class="l" x1="182" y1="120" x2="224" y2="124"/>
  </g>
  <circle class="joint" cx="182" cy="120" r="3.2"/>

</svg>
