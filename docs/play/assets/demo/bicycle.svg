<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Bicycle crunch: rotate from the ribs and alternate elbow toward the opposite knee">
<title>Bicycle crunch: rotate from the ribs and alternate elbow toward the opposite knee</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#ff7a45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
  </defs>

<style>
  .near{fill:none;stroke:#eaf5ef;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
  .far{fill:none;stroke:#6f9488;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .move{fill:none;stroke:#ff7a45;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
  .torso{fill:#eaf5ef;stroke:none}
  .torsofar{fill:#6f9488;stroke:none;opacity:.9}
  .head{fill:#eaf5ef;stroke:none}
  .headfar{fill:#6f9488;stroke:none;opacity:.9}
  .mat{stroke:#2f5e52;stroke-width:2.5;stroke-linecap:round}
  .shadow{fill:#000000;opacity:.32}
  .ref{fill:none;stroke:#6f9488;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:4 7;opacity:.75}
  .arc{fill:none;stroke:#ff7a45;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:5 6;opacity:.8}
  .glow{fill:none;stroke:#ff7a45;stroke-width:3;stroke-linecap:round;opacity:.8}
  g[data-o]{transform-box:view-box}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

  .legA{animation:legA 3.4s ease-in-out infinite}
  .elbow{animation:elbow 3.4s ease-in-out infinite}
  @keyframes legA{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
  @keyframes elbow{0%,100%{transform:rotate(0)}50%{transform:rotate(11deg)}}
</style>
<ellipse cx="140" cy="108" rx="120" ry="50" fill="url(#pool)"/>
<line class="mat" x1="26" y1="130" x2="294" y2="130"/>
<g transform="translate(160 130) scale(1.1) translate(-160 -130)">

  <ellipse class="shadow" cx="126" cy="132" rx="78" ry="3.5"/>
  <path class="torso" d="M84 104 L158 116 L156 124 L82 112 Z"/>
  <line class="far" x1="86" y1="106" x2="100" y2="88"/>
  <line class="far" x1="156" y1="122" x2="140" y2="96"/>
  <line class="far" x1="140" y1="96" x2="150" y2="72"/>
  <g data-o="1" style="transform-origin:88px 108px" class="elbow">
    <line class="near" x1="88" y1="108" x2="102" y2="88"/>
  </g>
  <g data-o="1" style="transform-origin:158px 120px" class="legA">
    <line class="move" x1="158" y1="120" x2="188" y2="94"/>
    <line class="move" x1="188" y1="94" x2="216" y2="108"/>
  </g>
  <line class="near" x1="84" y1="108" x2="74" y2="104" stroke-width="5"/>
  <circle class="head" cx="64" cy="101" r="8.5"/>
  <path class="arc" d="M198 118 q16 -2 22 -12" marker-end="url(#a)">
    <animate attributeName="opacity" values="0;.9;0" dur="3.4s" repeatCount="indefinite"/>
  </path>

</g>
</svg>
